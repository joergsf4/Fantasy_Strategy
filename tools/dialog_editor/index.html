<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog-Editor</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "Cinzel"; src: url("/assets/fonts/CinzelDecorative-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "IM Fell"; src: url("/assets/fonts/IMFeENrm28P.ttf"); }
:root {
  --bg: #12111c; --panel: #1b1a2a; --panel2: #232238; --line: #34324f; --text: #ece6d6; --muted: #a39fb8;
  --gold: #e8c066; --gold-d: #b8913a; --red: #e07070; --green: #7fd08f; --blue: #7aa8e8; --focus: #8fc1ff;
  --r: 10px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: "Cinzel", serif; margin: 0; letter-spacing: .02em; }
button { cursor: pointer; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--gold-d); }
.btn.primary { background: var(--gold); color: #2a2110; border-color: var(--gold-d); font-weight: 600; }
.btn.primary:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 4px 8px; }
.btn.ghost:hover { color: var(--text); background: var(--panel2); }
.btn.danger:hover { color: var(--red); }
input, select, textarea { background: #12111c; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
input:hover, select:hover, textarea:hover { border-color: #4a4770; }

/* Raster: Kopfleiste, Kapitel links, Inhalt, Figuren rechts */
#app { display: grid; grid-template-columns: 250px minmax(0, 1fr) 270px; grid-template-rows: 56px minmax(0, 1fr); height: 100vh; }
header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header.top h1 { font-size: 20px; color: var(--gold); }
.tabs { display: flex; gap: 4px; margin-right: auto; margin-left: 10px; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 16px 14px 13px; font-weight: 600; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
body.view-char #app { grid-template-columns: minmax(0, 1fr); }
body.view-char nav.chapters, body.view-char aside.pal, body.view-char #q, body.view-char #togglePal { display: none; }
/* Charaktere */
.ctool { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.chip2 { background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 3px 12px; font-size: 13px; }
.chip2[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: #2a2412; }
.chip2 small { color: var(--muted); margin-left: 4px; }
.cnote { background: var(--panel); border: 1px dashed var(--gold-d); border-radius: var(--r); padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; color: var(--muted); }
.cnote b { color: var(--text); }
.cwrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.cwrap.sel { grid-template-columns: minmax(0, 1fr) 450px; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.ccard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; grid-template-columns: 56px 1fr; gap: 4px 10px; align-items: start; }
.ccard:hover { border-color: var(--gold-d); }
.ccard[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px #e8c06633; }
.ccard .av { grid-row: 1 / span 3; width: 56px; height: 56px; }
.ccard h3 { font-size: 15px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ccard .meta { color: var(--muted); font-size: 12.5px; }
.ccard .ab { font-size: 12.5px; color: var(--text); }
.kind { font-size: 11px; border-radius: 6px; padding: 1px 7px; font-family: system-ui; background: #1d2a3d; color: var(--blue); }
.kind.Gegner { background: #3a1c1c; color: var(--red); } .kind.Boss { background: #3b2f12; color: var(--gold); } .kind.Sonstige { background: #2a2a38; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
.dot.ok { background: var(--green); } .dot.warn { background: var(--gold); } .dot.bad { background: var(--red); }
.cdetail { position: sticky; top: 0; background: var(--panel); border: 1px solid var(--gold-d); border-radius: 14px; padding: 16px; max-height: calc(100vh - 100px); overflow: auto; }
.cdetail h2 { font-size: 20px; color: var(--gold); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cdetail h4 { margin: 14px 0 6px; font-family: "Cinzel", serif; color: var(--gold); font-size: 14px; letter-spacing: .04em; }
.cdetail .big { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.cdetail .big .av { width: 84px; height: 84px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stats div { background: var(--panel2); border-radius: 8px; padding: 4px 8px; font-size: 12px; color: var(--muted); }
.stats b { display: block; color: var(--text); font-size: 15px; }
.abil { background: var(--panel2); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 13.5px; }
.abil b { color: var(--gold); } .abil small { color: var(--muted); display: block; }
.tl { display: grid; gap: 4px; }
.tlrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--panel2); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
.tlrow.key { border-left: 3px solid var(--gold); }
.tlrow.none { opacity: .45; }
.sym { display: inline-block; min-width: 20px; text-align: center; border-radius: 5px; padding: 0 5px; font-size: 11px; font-weight: 700; color: #12111c; margin-right: 3px; }
.cdetail blockquote { margin: 6px 0; padding: 6px 12px; border-left: 3px solid var(--gold-d); font: 17px/1.4 "IM Fell", Georgia, serif; color: var(--text); }
.cdetail p { margin: 4px 0; font-size: 13.5px; }
.cdetail .kv { color: var(--muted); }
table.ct { width: 100%; border-collapse: collapse; font-size: 13px; }
table.ct th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: -18px; background: var(--bg); cursor: pointer; white-space: nowrap; }
table.ct th:hover { color: var(--gold); }
table.ct td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.ct tr:hover td { background: var(--panel); }
table.ct tr.rsel td { background: #2a2412; }
table.ct .av { width: 28px; height: 28px; border-width: 1px; display: inline-grid; vertical-align: middle; margin-right: 8px; }
body.view-mis nav.chapters, body.view-mis #q, body.view-mis #togglePal { display: none; }
body.view-sec #app { grid-template-columns: minmax(0, 1fr); }
body.view-sec nav.chapters, body.view-sec aside.pal, body.view-sec #q, body.view-sec #togglePal { display: none; }
/* Geheimnisse */
.scard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 18px; padding: 14px; display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 18px; }
@media (max-width: 900px) { .scard { grid-template-columns: 1fr; } }
.sprev { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: linear-gradient(#3f6e3a, #2a4a2a) center / cover; border: 1px solid var(--line); }
.sprev img { position: absolute; bottom: 0; height: 88%; object-fit: contain; }
.sprev .l { left: -2%; max-width: 62%; } .sprev .r { right: -2%; max-width: 56%; }
.sprev .tag { position: absolute; top: 6px; left: 0; right: 0; text-align: center; color: var(--gold); font-weight: 700; text-shadow: 0 1px 4px #000; font-size: 15px; }
.sform label { display: block; color: var(--muted); font-size: 12.5px; margin: 8px 0 3px; }
.sform .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sform select, .sform input[type=text], .sform input[type=number], .sform textarea { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
.sform input[type=text].wide { width: 100%; }
.sform input[type=number] { width: 70px; }
.sline { display: grid; grid-template-columns: 150px 1fr auto; gap: 6px; margin: 5px 0; align-items: start; }
.sline textarea { width: 100%; min-height: 40px; resize: vertical; }
.sbox { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
.sbox h4 { font-size: 13px; color: var(--gold); margin-bottom: 4px; }
body.view-mis #app { grid-template-columns: minmax(0, 1fr) 270px; }
/* Missionen */
.mbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.mbar .sp { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.mgrid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.mlist { background: var(--panel); border: 2px dashed var(--line); border-radius: var(--r); padding: 10px; margin-bottom: 14px; min-height: 90px; }
.mlist.drop { border-color: var(--gold); background: #1f1c10; }
.mlist h3 { font-size: 16px; color: var(--gold); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.mcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 8px; }
.mcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; grid-template-columns: 44px 1fr auto; gap: 2px 8px; align-items: center; cursor: grab; }
.mcard.warn { border-color: var(--gold); }
.mcard .av { width: 44px; height: 44px; grid-row: 1 / span 2; }
.mcard b { font-size: 14px; }
.mcard small { color: var(--muted); font-size: 12px; grid-column: 2 / 4; }
.mcard .wn { grid-column: 1 / -1; color: var(--gold); font-size: 12.5px; }
.mcard .x { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 2px 6px; border-radius: 6px; }
.mcard .x:hover { color: var(--red); background: var(--panel); }
.mm { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.mm .tile { position: absolute; width: 27px; height: 27px; }
.mm .pin { position: absolute; width: 27px; height: 27px; display: grid; place-items: center; }
.mm .pin .av { width: 24px; height: 24px; border-width: 2px; }
.mm .pin.p .av { border-color: var(--blue); } .mm .pin.e .av { border-color: var(--red); }
.mm .obj { position: absolute; width: 19px; height: 19px; margin: 4px; background: #3a2a1a; border: 1px solid #0007; border-radius: 3px; font-size: 10px; color: #e8d9b0; text-align: center; line-height: 17px; }
.mwarn { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.mwarn h3 { font-size: 15px; color: var(--gold); margin-bottom: 6px; }
.mwarn ul { margin: 0; padding-left: 18px; font-size: 13.5px; } .mwarn li { margin-bottom: 4px; }
.mwarn li.ok { color: var(--green); list-style: none; margin-left: -18px; }
@media (max-width: 1100px) { .mgrid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1100px) { .cwrap.sel { grid-template-columns: minmax(0, 1fr); } .cdetail { position: static; max-height: none; } }
#status { color: var(--muted); font-size: 13px; }
#status.dirty { color: var(--gold); }
nav.chapters { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 12px 8px; }
nav.chapters h2 { font-size: 12px; color: var(--muted); padding: 4px 10px 8px; text-transform: uppercase; letter-spacing: .1em; font-family: system-ui; }
.ch { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; margin-bottom: 2px; }
.ch:hover { background: var(--panel2); }
.ch[aria-current="true"] { background: var(--panel2); border-color: var(--gold-d); }
.ch .n { color: var(--gold); font-family: "Cinzel", serif; }
.ch small { display: block; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-left: 6px; }
main { overflow: auto; padding: 18px 26px 80px; scroll-behavior: smooth; }
aside.pal { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 12px; }
aside.pal h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-family: system-ui; margin: 14px 0 8px; }
aside.pal input { width: 100%; }
.hint { color: var(--muted); font-size: 12.5px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; text-align: center; cursor: grab; user-select: none; }
.tile:hover { border-color: var(--gold-d); }
.tile .av { margin: 0 auto 3px; }
.tile span { font-size: 11.5px; display: block; line-height: 1.2; overflow-wrap: anywhere; }

.av { width: 52px; height: 52px; border-radius: 50%; background: #0c0b14 center top / cover no-repeat; border: 2px solid var(--line); overflow: hidden; display: grid; place-items: center; color: var(--gold); font-family: "Cinzel"; flex: none; }
.av img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
.av.sm { width: 28px; height: 28px; border-width: 1px; font-size: 13px; margin-left: -8px; }

section.block { margin-bottom: 34px; }
.block > .bh { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; position: sticky; top: -18px; background: linear-gradient(var(--bg) 80%, transparent); padding: 12px 0 8px; z-index: 5; }
.block > .bh h2 { font-size: 20px; color: var(--gold); }
.count { background: var(--panel2); border-radius: 20px; padding: 0 9px; color: var(--muted); font-size: 12px; }
.bh .sp { margin-left: auto; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; text-align: center; color: var(--muted); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; }
.card.hide { display: none; }
.card > header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
.card > header .tt { flex: 1; min-width: 0; }
.card > header h3 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card > header .sub { color: var(--muted); font-size: 12.5px; }
.cast { display: flex; padding-left: 8px; }
.chev { transition: transform .15s; color: var(--muted); }
.card.open .chev { transform: rotate(90deg); }
.card .body { display: none; padding: 4px 14px 14px; border-top: 1px solid var(--line); }
.card.open .body { display: block; }
.badge { font-size: 11px; background: #3b2f12; color: var(--gold); border-radius: 6px; padding: 1px 7px; margin-left: 6px; font-family: system-ui; }

details.trig { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; margin: 12px 0; }
details.trig > summary { padding: 8px 12px; cursor: pointer; color: var(--gold); }
details.trig .in { padding: 4px 12px 12px; display: grid; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
label.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
label.f select, label.f input { min-width: 120px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { background: #12111c; border: 1px solid var(--line); border-radius: 20px; padding: 2px 4px 2px 10px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.chip button { background: none; border: 0; color: var(--muted); padding: 0 6px; }
.chip button:hover { color: var(--red); }
.note { width: 100%; }

.line { display: grid; grid-template-columns: 22px 92px 92px minmax(0, 1fr) 32px; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); position: relative; }
.line:first-child { border-top: 0; }
.line.over-top::before, .line.over-bot::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: var(--gold); border-radius: 2px; }
.line.over-top::before { top: -2px; } .line.over-bot::after { bottom: -2px; }
.line.dragging { opacity: .4; }
.grip { cursor: grab; color: var(--muted); text-align: center; padding-top: 14px; user-select: none; }
.slot { text-align: center; border: 2px dashed transparent; border-radius: 10px; padding: 3px; }
.slot.drop { border-color: var(--gold); background: #2a2412; }
.slot .av { margin: 0 auto; cursor: pointer; width: 56px; height: 56px; }
.slot.speaking .av { border-color: var(--gold); box-shadow: 0 0 0 2px #e8c06644; }
.slot .nm { font-size: 12px; line-height: 1.2; margin-top: 3px; max-width: 92px; margin-inline: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .nm.none { color: var(--muted); }
.slot .tools { display: flex; gap: 2px; justify-content: center; margin-top: 2px; }
.slot .tools button { background: none; border: 0; padding: 1px 4px; border-radius: 5px; color: var(--muted); font-size: 12px; }
.slot .tools button:hover { background: var(--panel2); color: var(--text); }
.slot.speaking .tools .say { color: var(--gold); }
.slot select { font-size: 11px; padding: 1px 3px; margin-top: 2px; max-width: 88px; }
.txt { width: 100%; resize: none; overflow: hidden; min-height: 60px; font-family: "IM Fell", Georgia, serif; font-size: 17px; line-height: 1.4; }
.tb { display: grid; gap: 4px; }
.tb label { display: grid; grid-template-columns: 90px 1fr; gap: 6px; align-items: start; font-size: 12px; color: var(--muted); }
.tb textarea { min-height: 40px; line-height: 1.35; font-family: "IM Fell", Georgia, serif; font-size: 16px; resize: none; overflow: hidden; }
.add { border: 2px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; color: var(--muted); background: none; width: 100%; margin-top: 8px; }
.add:hover, .add.drop { border-color: var(--gold); color: var(--gold); }

.ideas { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.ideas li { background: var(--panel); border: 1px dashed var(--gold-d); border-radius: 8px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
.ideas li span { flex: 1; }

/* Overlays */
.modal-bg { position: fixed; inset: 0; background: #0009; display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { background: var(--panel); border: 1px solid var(--gold-d); border-radius: 14px; max-width: 640px; width: 100%; padding: 20px; max-height: 92vh; overflow: auto; }
.modal h2 { color: var(--gold); margin-bottom: 8px; }
.modal textarea { width: 100%; min-height: 110px; }
.modal .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 14px; }
.picker { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--gold-d); border-radius: 10px; width: 240px; padding: 8px; box-shadow: 0 10px 30px #000a; }
.picker input { width: 100%; margin-bottom: 6px; }
.picker ul { list-style: none; padding: 0; margin: 0; max-height: 280px; overflow: auto; }
.picker li { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.picker li .av { width: 28px; height: 28px; border-width: 1px; }
.picker li.sel, .picker li:hover { background: var(--panel2); }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 80; }
.t { background: var(--panel2); border: 1px solid var(--gold-d); border-radius: 10px; padding: 8px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 24px #000a; }
.t.err { border-color: var(--red); }
.pv { position: fixed; inset: 0; background: #07060dee; z-index: 70; display: grid; grid-template-rows: 1fr auto; padding: 20px; }
.pv .stage { position: relative; display: flex; justify-content: space-between; align-items: end; max-width: 1100px; width: 100%; margin: 0 auto; }
.pv .stage img, .pv .stage .ph { height: min(62vh, 560px); max-width: 44%; object-fit: contain; transition: filter .2s, opacity .2s; }
.pv .stage .ph { width: 300px; display: grid; place-items: center; font: 120px "Cinzel"; color: var(--gold); }
.pv .stage .dim { filter: brightness(.45); }
.pv .stage .r { transform: scaleX(-1); }
.pv .box { max-width: 1100px; width: 100%; margin: 12px auto 0; background: var(--panel); border: 1px solid var(--gold-d); border-radius: 14px; padding: 18px 24px; min-height: 130px; position: relative; }
.pv .box .who { position: absolute; top: -16px; background: var(--panel2); border: 1px solid var(--gold-d); border-radius: 20px; padding: 2px 18px; font-family: "Cinzel"; color: var(--gold); }
.pv .box p { margin: 6px 0 0; font: 24px/1.4 "IM Fell", Georgia, serif; }
.pv .ctl { position: absolute; right: 14px; bottom: 8px; color: var(--muted); font-size: 12px; }
.spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: sp 0.8s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 1150px) { #app { grid-template-columns: 210px minmax(0, 1fr); } aside.pal { display: none; } body.pal-open aside.pal { display: block; position: fixed; right: 0; top: 56px; bottom: 0; width: 270px; z-index: 40; } }
@media (min-width: 1151px) { #togglePal { display: none; } }
@media (max-width: 760px) { #app { grid-template-columns: minmax(0, 1fr); } nav.chapters { display: none; } .line { grid-template-columns: 22px 80px 80px minmax(0, 1fr); } .line .del { grid-column: 4; justify-self: end; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Dialog-Editor</h1>
    <div class="tabs" role="tablist" aria-label="Ansicht">
      <button id="tabTalks" role="tab" aria-selected="true">Gespräche</button>
      <button id="tabChars" role="tab" aria-selected="false">Charaktere</button>
      <button id="tabMis" role="tab" aria-selected="false">Missionen</button>
      <button id="tabSec" role="tab" aria-selected="false">Geheimnisse</button>
    </div>
    <input id="q" type="search" placeholder="Texte durchsuchen …" aria-label="Gespräche durchsuchen" style="width:240px">
    <span id="status" role="status" aria-live="polite"></span>
    <button class="btn ghost" id="togglePal" title="Figuren ein- oder ausblenden">Figuren</button>
    <button class="btn" id="undo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶ Rückgängig</button>
    <button class="btn" id="redo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen">↷</button>
    <button class="btn primary" id="save" title="Speichern (Strg+S)">Speichern</button>
  </header>
  <nav class="chapters" id="nav" aria-label="Kapitel"></nav>
  <main id="main" tabindex="-1"></main>
  <aside class="pal" aria-label="Figuren" data-drop="mrem">
    <input id="palq" type="search" placeholder="Figur suchen …" aria-label="Figur suchen">
    <p class="hint" id="palhint">Figur auf einen <b>Platz</b> in einer Zeile ziehen, oder auf <b>+ Zeile</b>, um eine neue Zeile anzulegen. Zeilen lassen sich am Griff ⋮⋮ umsortieren, auch in andere Gespräche.</p>
    <div id="pal"></div>
  </aside>
</div>
<div id="toast" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = x => JSON.parse(JSON.stringify(x));
const EXPR = { "": "Normal", lachend: "Lachend", wuetend: "Wütend" };
const STATES = { wall: ["intact", "broken"], gate: ["closed", "open", "broken"], switch: ["off", "on"], fire: ["burning", "out"], house: ["intact", "burning", "ruin"], hostage: ["bound", "free"], teahouse: ["standing"], hive: ["active", "broken"], bell: ["ready", "rung"], orphanage: ["standing"], ship: ["anchored"], crate: ["intact", "broken"] };
const STATE_DE = { intact: "heil", broken: "zerstört", closed: "geschlossen", open: "offen", off: "aus", on: "umgelegt", burning: "brennt", out: "gelöscht", ruin: "Ruine", bound: "gefesselt", free: "befreit", standing: "steht", active: "aktiv", ready: "bereit", rung: "geläutet", anchored: "vor Anker" };

let MIS = null, mis = [], misSaved = {}, misHist = [], misFut = [], mCur = "ch1";
let view = "talks", CH = null, cView = "cards", cFilter = "alle", cq = "", cSort = { key: "first", dir: 1 }, cSel = "";
let DB, chapters = [], saved = {}, cur = "", hist = [], fut = [], canDraft = false, typingSnap = false, filter = "", open = {};

// ---- Zustand, Rückgängig, Speichern
const part = c => JSON.stringify({ intro: c.intro, outro: c.outro, triggers: c.triggers, flee: c.flee, ideas: c.ideas });
const ch = () => chapters.find(c => c.id === cur);
const dirtyIds = () => chapters.filter(c => part(c) !== saved[c.id]).map(c => c.id);
function push() { hist.push(JSON.stringify(chapters)); if (hist.length > 200) hist.shift(); fut = []; }
function restore(from, to) { if (!from.length) return; to.push(JSON.stringify(chapters)); chapters = JSON.parse(from.pop()); render(); }
const undo = () => restore(hist, fut), redo = () => restore(fut, hist);
function change(fn) { push(); fn(); render(); }
const noteDirty = {};        // "figur:feld" -> ungespeicherter Text der Faehigkeits-Felder im Tab Charaktere
const totalDirty = () => dirtyIds().length + misDirty().length + Object.keys(noteDirty).length + secDirty();
function updateStatus() {
  const n = totalDirty(), s = $("#status");
  s.textContent = n ? `● Ungespeicherte Änderungen (${n})` : "Alles gespeichert";
  s.className = n ? "dirty" : "";
  $("#save").disabled = !n;
  const hs = view === "mis" ? [misHist, misFut] : view === "talks" ? [hist, fut] : [[], []];     // Charaktere und Geheimnisse: ohne Rueckgaengig     // Rueckgaengig gilt je Tab
  $("#undo").disabled = !hs[0].length; $("#redo").disabled = !hs[1].length;
  document.querySelectorAll(".ch").forEach(b => { const d = dirtyIds().includes(b.dataset.id); b.querySelector(".dot")?.remove(); if (d) b.querySelector(".n").insertAdjacentHTML("afterend", '<span class="dot" title="Ungespeichert"></span>'); });
}
const undoCur = () => view === "mis" ? misRestore(misHist, misFut) : view === "talks" ? undo() : null;
const redoCur = () => view === "mis" ? misRestore(misFut, misHist) : view === "talks" ? redo() : null;
async function saveChapters() {
  for (const id of dirtyIds()) {
    const c = chapters.find(x => x.id === id);
    const r = await fetch(`/api/chapter/${id}`, { method: "PUT", body: JSON.stringify({ intro: c.intro, outro: c.outro, triggers: c.triggers, flee: c.flee, ideas: c.ideas }) });
    if (!r.ok) { toast(`Speichern fehlgeschlagen (${c.title}): ${(await r.json()).error}`, "err"); return false; }
    saved[id] = part(c);
  }
  return true;
}
async function saveNotes() {
  for (const [k, text] of Object.entries(noteDirty)) {
    const [id, slot] = k.split(":");
    const r = await fetch(`/api/character/${id}/note`, { method: "PUT", body: JSON.stringify({ slot: +slot, text }) });
    if (!r.ok) { toast("Speichern fehlgeschlagen: " + (await r.json()).error, "err"); return false; }
    CH.characters.find(c => c.id === id).ability_notes.saved[+slot] = text.trim();
    delete noteDirty[k];
  }
  return true;
}
/** Speichert alles Ungespeicherte aus allen drei Tabs (Gespraeche, Missionen, Faehigkeits-Texte). */
async function save() {
  if (!(await saveChapters()) || !(await misSave(true)) || !(await saveNotes()) || !(await saveSecrets())) return updateStatus();
  toast("Gespeichert"); updateStatus(); if (view === "mis") renderMis(); else if (view === "char") renderCharRes(); else if (view === "sec") renderSec();
}
function toast(msg, kind, undoFn) {
  const t = document.createElement("div"); t.className = "t " + (kind || ""); t.textContent = msg;
  if (undoFn) { const b = document.createElement("button"); b.className = "btn"; b.textContent = "Rückgängig"; b.onclick = () => { undoFn(); t.remove(); }; t.append(b); }
  $("#toast").append(t); setTimeout(() => t.remove(), undoFn ? 7000 : kind === "err" ? 9000 : 2600);
}

// ---- Beschreibungen in Alltagssprache
const U = id => id === "any_enemy" ? "irgendein Gegner" : id === "$hero" ? "die auslösende Figur" : DB.units[id]?.name || id || "?";
const A = id => DB.abilities[id] || id;
function describeWhen(w) {
  if (w.manual) return "Wird von einem anderen Gespräch zeitverzögert ausgelöst";
  if ("turn" in w) return `Runde ${w.turn} beginnt`;
  if (w.enter) return `Eine Figur betritt das Feld (${w.enter[0]}, ${w.enter[1]})`;
  if (w.object) return `${w.object.id} ist „${STATE_DE[w.object.state] || w.object.state}“`;
  if (w.heal) return `${w.heal.by ? U(w.heal.by) : "Jemand"} heilt mindestens ${w.heal.targets || 1} Verbündete`;
  if (w.ability) return `${w.ability.by ? U(w.ability.by) : "Jemand"} setzt ${A(w.ability.id)} ein`;
  if (w.kill) return `${w.kill.id ? U(w.kill.id) + " wird besiegt" : "Ein Gegner wird besiegt"}${w.kill.count ? ` (insgesamt ${w.kill.count} Gegner)` : ""}`;
  if (w.first_kill) return "Der erste Gegner wird besiegt";
  if (w.fall) return w.fall.id ? `${U(w.fall.id)} fällt` : "Ein Held fällt";
  if (w.hp_below) return `${U(w.hp_below.id)} hat weniger als ${Math.round(w.hp_below.ratio * 100)} % Leben`;
  if (w.near) return `${U(w.near.a)} und ${U(w.near.b)} sind höchstens ${w.near.dist} Felder entfernt`;
  if ("enemies_left" in w) return `Höchstens ${w.enemies_left} Gegner übrig`;
  return JSON.stringify(w);
}
function describeIf(c) {
  const out = [];
  if (c.present?.length) out.push(`${c.present.map(U).join(", ")} ${c.present.length > 1 ? "leben" : "lebt"} noch`);
  if (c.absent?.length) out.push(`${c.absent.map(U).join(", ")} ${c.absent.length > 1 ? "sind" : "ist"} nicht mehr im Kampf`);
  if (c.fled?.length) out.push(`${c.fled.map(U).join(", ")} ${c.fled.length > 1 ? "sind" : "ist"} früher entkommen`);
  if (c.object) out.push(`${c.object.id} ist „${STATE_DE[c.object.state] || c.object.state}“`);
  return out.join(" · ");
}

// ---- Auslöser-Felder (Pfade im JSON, damit eine Tabelle alle Typen beschreibt)
const unitOpts = (extra = []) => [...extra, ...Object.keys(DB.units).filter(k => !DB.units[k].special)];
const WHEN = {
  turn: { label: "Eine Runde beginnt", f: [{ p: ["turn"], l: "Runde", t: "int", d: 2 }] },
  near: { label: "Zwei Figuren kommen sich nahe", f: [{ p: ["near", "a"], l: "Figur A", t: "unit", d: "ritter" }, { p: ["near", "b"], l: "Figur B", t: "unit+", d: "any_enemy" }, { p: ["near", "dist"], l: "höchstens … Felder", t: "int", d: 3 }] },
  ability: { label: "Eine Fähigkeit wird eingesetzt", f: [{ p: ["ability", "id"], l: "Fähigkeit", t: "ability", d: "kanone" }, { p: ["ability", "by"], l: "Von (optional)", t: "unit?", d: "" }] },
  heal: { label: "Jemand heilt Verbündete", f: [{ p: ["heal", "by"], l: "Heiler/in", t: "unit?", d: "wendy" }, { p: ["heal", "targets"], l: "mind. Ziele", t: "int", d: 3 }] },
  kill: { label: "Ein Gegner wird besiegt", f: [{ p: ["kill", "id"], l: "Gegner (optional)", t: "unit?", d: "" }, { p: ["kill", "count"], l: "insgesamt (optional)", t: "int?", d: "" }] },
  first_kill: { label: "Der erste Gegner wird besiegt", f: [], make: () => ({ first_kill: true }) },
  fall: { label: "Ein Held fällt", f: [{ p: ["fall", "id"], l: "Held (leer = irgendeiner)", t: "unit?", d: "" }], make: () => ({ fall: {} }) },
  hp_below: { label: "Eine Figur hat wenig Leben", f: [{ p: ["hp_below", "id"], l: "Figur", t: "unit", d: "ritter" }, { p: ["hp_below", "ratio"], l: "Anteil (0–1)", t: "float", d: 0.5 }] },
  object: { label: "Ein Objekt ändert sich (Tor, Geisel …)", f: [{ p: ["object", "id"], l: "Objekt", t: "obj", d: "" }, { p: ["object", "state"], l: "Zustand", t: "state", d: "" }] },
  enter: { label: "Eine Figur betritt ein Feld", f: [{ p: ["enter", 0], l: "x", t: "int", d: 5 }, { p: ["enter", 1], l: "y", t: "int", d: 3 }] },
  manual: { label: "Von einem anderen Gespräch verzögert ausgelöst", f: [], make: () => ({ manual: true }) },
  enemies_left: { label: "Nur noch wenige Gegner übrig", f: [{ p: ["enemies_left"], l: "höchstens", t: "int", d: 2 }] },
};
const whenType = w => Object.keys(WHEN).find(k => k in w) || "turn";
const getP = (o, p) => p.reduce((x, k) => x?.[k], o);
function setP(o, p, v) {
  for (let i = 0; i < p.length - 1; i++) o = o[p[i]] ??= typeof p[i + 1] === "number" ? [] : {};
  const k = p.at(-1);
  if (v === "" || v === undefined) delete o[k]; else o[k] = v;
}
function makeWhen(type, c) {
  const def = WHEN[type];
  if (def.make) return def.make();
  const w = {};
  const objs = chapters.find(x => x.id === c)?.objects || [];
  def.f.forEach(f => setP(w, f.p, f.t === "obj" ? objs[0]?.id : f.t === "state" ? STATES[objs[0]?.type]?.[0] : f.d));
  return w;
}

// ---- Bausteine der Darstellung
const portrait = (id, expr) => {
  if (!id) return "";
  const u = DB.units[id];
  if (!u?.portrait) return "";
  return `/assets/portraits/${id}${expr && u.exprs.includes(expr) ? "_" + expr : ""}.png`;
};
const avatar = (id, expr, cls = "") => {
  const src = portrait(id, expr);
  return `<div class="av ${cls}" title="${esc(U(id))}">${src ? `<img src="${src}" alt="" loading="lazy">` : id ? "?" : ""}</div>`;
};
function convs(c) {
  const out = [{ key: "intro", kind: "intro" }, { key: "outro", kind: "outro" }];
  c.triggers.forEach((t, i) => out.push({ key: "t:" + i, kind: "trig", t, i }));
  Object.keys(c.flee).forEach(k => out.push({ key: "f:" + k, kind: "flee", uid: k }));
  return out;
}
function linesOf(c, key, create = true) {
  if (key === "intro" || key === "outro") return c[key];
  if (key.startsWith("f:")) return c.flee[key.slice(2)];
  const t = c.triggers[+key.slice(2)];
  let s = t.do.find(x => x.dialogue);
  if (!s && create) t.do.push(s = { dialogue: [] });
  return s?.dialogue || [];
}
const castOf = lines => [...new Set(lines.flatMap(l => [l.left, l.right]).filter(Boolean))];
const textOf = l => l.text ?? Object.values(l.text_by || {}).join(" ");
const hay = (c, cv) => (linesOf(c, cv.key, false).map(textOf).join(" ") + " " + (cv.t ? describeWhen(cv.t.when) + (cv.t.note || "") : cv.kind) + " " + castOf(linesOf(c, cv.key, false)).map(U).join(" ")).toLowerCase();

function slotHtml(l, side) {
  const id = l[side], speaking = l.speaker && l.speaker === id, u = DB.units[id], ex = l[side + "_expr"] || "";
  return `<div class="slot ${speaking ? "speaking" : ""}" data-side="${side}" data-drop="slot">
    <div data-act="pick" tabindex="0" role="button" aria-label="${side === "left" ? "Linke" : "Rechte"} Figur wählen">${id ? avatar(id, ex) : '<div class="av" title="Figur wählen">+</div>'}</div>
    <div class="nm ${id ? "" : "none"}">${id ? esc(U(id)) : "leer"}</div>
    ${id && u?.exprs.length ? `<select data-bind="expr" aria-label="Gesichtsausdruck">${Object.entries(EXPR).filter(([k]) => !k || u.exprs.includes(k)).map(([k, v]) => `<option value="${k}" ${k === ex ? "selected" : ""}>${v}</option>`).join("")}</select>` : ""}
    <div class="tools">${id ? `<button class="say" data-act="speaker" title="Diese Figur spricht">💬${speaking ? " spricht" : ""}</button><button data-act="clear" title="Figur entfernen" aria-label="Figur entfernen">✕</button>` : ""}</div>
  </div>`;
}
function lineHtml(l, i) {
  const body = l.text_by
    ? `<div class="tb">${Object.entries(l.text_by).map(([k, v]) => `<label>${esc(k === "default" ? "Standard" : U(k))}<textarea data-bind="tb" data-k="${esc(k)}" rows="1">${esc(v)}</textarea></label>`).join("")}</div>`
    : `<textarea class="txt" data-bind="text" rows="2" placeholder="Was wird gesagt? …" aria-label="Text">${esc(l.text)}</textarea>`;
  return `<div class="line" data-i="${i}" data-drop="line">
    <div class="grip" draggable="true" data-drag="line" title="Zum Umsortieren ziehen" aria-hidden="true">⋮⋮</div>
    ${slotHtml(l, "left")}${slotHtml(l, "right")}${body}
    <button class="btn ghost danger del" data-act="delline" title="Zeile löschen" aria-label="Zeile löschen">🗑</button></div>`;
}
function whenEditor(cv, c) {
  const t = cv.t, type = whenType(t.when);
  const field = f => {
    const v = getP(t.when, f.p) ?? "";
    const b = `data-bind="field" data-p="${esc(JSON.stringify(f.p))}" data-t="${f.t}"`;
    if (f.t.startsWith("unit")) return `<select ${b}>${f.t.endsWith("?") ? '<option value="">— egal —</option>' : ""}${(f.t === "unit+" ? unitOpts(["any_enemy"]) : unitOpts()).map(k => `<option value="${k}" ${k === v ? "selected" : ""}>${esc(U(k))}</option>`).join("")}</select>`;
    if (f.t === "ability") return `<select ${b}>${Object.entries(DB.abilities).map(([k, n]) => `<option value="${k}" ${k === v ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`;
    if (f.t === "obj") return `<select ${b}>${c.objects.map(o => `<option value="${o.id}" ${o.id === v ? "selected" : ""}>${esc(o.id)} (${o.type})</option>`).join("") || `<option value="${esc(v)}">${esc(v)}</option>`}</select>`;
    if (f.t === "state") { const ty = c.objects.find(o => o.id === t.when.object?.id)?.type; return `<select ${b}>${(STATES[ty] || [v]).map(s => `<option value="${s}" ${s === v ? "selected" : ""}>${STATE_DE[s] || s}</option>`).join("")}</select>`; }
    return `<input ${b} type="number" step="${f.t === "float" ? "0.05" : "1"}" value="${esc(v)}" style="width:100px">`;
  };
  const cond = t.if || {};
  const chips = (k, label) => cond[k]?.length ? `<div class="chips"><span class="hint">${label}</span>${cond[k].map((id, j) => `<span class="chip">${esc(U(id))}<button data-act="rmcond" data-k="${k}" data-j="${j}" aria-label="Entfernen">✕</button></span>`).join("")}</div>` : "";
  return `<details class="trig" ${open["w" + cv.i] ? "open" : ""} data-w="${cv.i}"><summary>Auslöser: ${esc(describeWhen(t.when))}${t.if && Object.keys(t.if).length ? " · nur wenn …" : ""}</summary><div class="in">
    <div class="row"><label class="f">Wann?<select data-bind="whentype">${Object.entries(WHEN).map(([k, v]) => `<option value="${k}" ${k === type ? "selected" : ""}>${v.label}</option>`).join("")}</select></label>
      ${WHEN[type].f.map(f => `<label class="f">${f.l}${field(f)}</label>`).join("")}</div>
    <div><div class="hint" style="margin-bottom:4px">Nur wenn … (optional)</div>${chips("present", "leben noch:")}${chips("absent", "nicht mehr da:")}${chips("fled", "früher entkommen:")}
      ${cond.object ? `<div class="chips"><span class="hint">Objekt:</span><span class="chip">${esc(cond.object.id)} = ${esc(STATE_DE[cond.object.state] || cond.object.state)}<button data-act="rmcond" data-k="object" aria-label="Entfernen">✕</button></span></div>` : ""}
      <div class="row" style="margin-top:6px"><button class="btn" data-act="addcond" data-k="present">+ lebt noch</button><button class="btn" data-act="addcond" data-k="absent">+ nicht mehr da</button><button class="btn" data-act="addcond" data-k="fled">+ früher entkommen</button></div></div>
    ${t.draft ? '<div class="row"><button class="btn" data-act="accept">✓ Entwurf übernehmen</button><span class="hint">Auslöser und Zeilen sind von Claude vorgeschlagen. Bitte prüfen und anpassen.</span></div>' : ""}
    <label class="f">Warum? (Notiz zur Idee, hilft beim späteren Überarbeiten)<input class="note" data-bind="note" value="${esc(t.note)}" placeholder="z. B. Meister Lin kennt Großmütter aus seinem Dorf"></label>
  </div></details>`;
}
function cardHtml(c, cv) {
  const lines = linesOf(c, cv.key, false), cast = castOf(lines);
  const title = cv.kind === "intro" ? "Einleitung" : cv.kind === "outro" ? "Abschluss" : cv.kind === "flee" ? `Rückzug: ${U(cv.uid)}` : describeWhen(cv.t.when);
  const sub = cv.kind === "trig" ? describeIf(cv.t.if || {}) || cv.t.note || "" : cv.kind === "flee" ? "Wenn die Figur besiegt wird, flieht sie mit diesem Gespräch" : "";
  const draft = cv.t?.draft ? '<span class="badge">Entwurf, bitte prüfen</span>' : "";
  return `<section class="card ${open[cv.key] ? "open" : ""}" data-c="${cv.key}">
    <header tabindex="0" role="button" aria-expanded="${!!open[cv.key]}" data-act="toggle"><span class="chev">▶</span>
      <div class="cast">${cast.map(id => avatar(id, "", "sm")).join("")}</div>
      <div class="tt"><h3>${esc(title)}${draft}</h3><div class="sub">${lines.length} Zeile${lines.length === 1 ? "" : "n"}${sub ? " · " + esc(sub) : ""}</div></div>
      <button class="btn ghost" data-act="preview" title="Wie im Spiel ansehen">▶ Vorschau</button>
      ${cv.kind === "trig" || cv.kind === "flee" ? `<button class="btn ghost" data-act="dup" title="Duplizieren" aria-label="Duplizieren">⧉</button><button class="btn ghost danger" data-act="delconv" title="Gespräch löschen" aria-label="Gespräch löschen">🗑</button>` : ""}
    </header>
    <div class="body">${cv.kind === "trig" ? whenEditor(cv, c) : ""}
      <div class="lines">${lines.map(lineHtml).join("")}</div>
      <button class="add" data-act="addline" data-drop="add">+ Zeile hinzufügen <span class="hint">(oder Figur hierher ziehen)</span></button>
    </div></section>`;
}
const fit = el => { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; };
const fitAll = () => document.querySelectorAll(".card.open textarea").forEach(fit);
function renderTalks() {
  const c = ch();
  $("#nav").innerHTML = `<h2>Kapitel</h2>` + chapters.map((x, i) => `<button class="ch" data-id="${x.id}" aria-current="${x.id === cur}"><span class="n">${i + 1}</span> ${esc(x.title)}<small>${x.triggers.length} Gespräche im Kampf</small></button>`).join("");
  const cs = convs(c), q = filter.toLowerCase();
  const sec = (title, kinds, extra = "", emptyMsg = "") => {
    const list = cs.filter(cv => kinds.includes(cv.kind));

// ---- Figurenauswahl (Tastatur- und Mausalternative zum Ziehen)
function openPicker(anchor, onPick, allowNone) {

  document.body.append(p);
  let sel = 0, items = [];
  const list = () => {
    const q = $("input", p).value.toLowerCase();
    items = Object.entries(DB.units).filter(([k, u]) => !q || u.name.toLowerCase().includes(q) || k.includes(q));
    $("ul", p).innerHTML = items.map(([k, u], i) => `<li role="option" data-id="${k}" class="${i === sel ? "sel" : ""}">${avatar(k)}${esc(u.name)}</li>`).join("");
  };
  list();
  $("input", p).focus();
  $("input", p).oninput = () => { sel = 0; list(); };
  $("input", p).onkeydown = e => {

    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); list(); e.preventDefault(); }
    else if (e.key === "Enter" && items[sel]) { onPick(items[sel][0]); closePicker(); }
    else if (e.key === "Escape") closePicker();

  $("ul", p).onclick = e => { const li = e.target.closest("li"); if (li) { onPick(li.dataset.id); closePicker(); } };
}

function modal(html) {

function newConvDialog(text = "", ideaIdx = -1) {

    <p class="hint">Beschreibe in einem Satz, <b>wann</b> und <b>warum</b> das Gespräch ausgelöst wird, zum Beispiel: „Wenn Meister Lin Xiùlán begegnet, erkennt er in ihr seine Großmutter-Lehrerin und verbeugt sich, sie macht sich darüber lustig.“</p>
    <textarea id="ndesc" placeholder="Wann und warum wird das Gespräch ausgelöst?">${esc(text)}</textarea>
    <p class="hint" id="nmsg">${canDraft ? "Claude schreibt daraus Auslöser und Zeilen als Entwurf. Das verbraucht Token. Du kannst alles danach ändern." : "Die Claude-CLI wurde nicht gefunden, daher kein automatischer Entwurf. „Als Idee merken“ speichert die Beschreibung, damit Claude Code sie später umsetzt."}</p>

    if (x === "idea") { m.remove(); return change(() => { if (ideaIdx < 0) c.ideas.push({ text: desc }); }); }
    if (x === "empty") { m.remove(); return addConv({ when: makeWhen("turn", c.id), do: [{ dialogue: [{ ...base(), speaker: base().left, text: "" }] }], ...(desc ? { note: desc } : {}) }, ideaIdx); }
    e.target.disabled = true; $("#nmsg", m).innerHTML = '<span class="spin"></span> Claude schreibt den Entwurf … (kann eine Minute dauern)';

}
function freeSpot(m, side) {
  const list = side === "p" ? m.players : m.enemies, h = m.rows.length, w = m.rows[0].length;
  const base = list.length ? [Math.round(list.reduce((a, e) => a + e.pos[0], 0) / list.length), Math.round(list.reduce((a, e) => a + e.pos[1], 0) / list.length)] : (side === "p" ? [1, h - 2] : [w - 2, 1]);
  const used = new Set([...m.players, ...m.enemies, ...m.objects].map(e => e.pos.join(",")));
  const seen = new Set([base.join(",")]), q = [base];
  while (q.length) {
    const [x, y] = q.shift();
    if (x >= 0 && y >= 0 && x < w && y < h && m.rows[y][x] !== "W" && !used.has(x + "," + y)) return [x, y];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const k = (x + dx) + "," + (y + dy); if (!seen.has(k)) { seen.add(k); q.push([x + dx, y + dy]); } }
  }
  return base;
}
function misAdd(side, id) {
  const m = mCh();
  if (side === "p" && m.players.some(e => e.id === id)) return toast(`${U(id)} ist schon in der Gruppe`);
  misPush(); (side === "p" ? m.players : m.enemies).push({ id, pos: freeSpot(m, side) }); renderMis();
}
function misRemove(side, i) { misPush(); (side === "p" ? mCh().players : mCh().enemies).splice(i, 1); renderMis(); }
async function misSave(quiet = false) {
  for (const id of misDirty()) {
    const m = mis.find(x => x.id === id);
    const r = await fetch(`/api/mission/${id}`, { method: "PUT", body: JSON.stringify({ players: m.players, enemies: m.enemies }) });
    if (!r.ok) { toast(`Speichern fehlgeschlagen (${m.title}): ${(await r.json()).error}`, "err"); return false; }
    misSaved[id] = misPart(m);
  }
  return true;
}
function miniMap(m) {
  const h = m.rows.length, w = m.rows[0].length, S = 27;
  const tiles = m.rows.map((r, y) => [...r].map((t, x) => `<div class="tile" style="left:${x * S}px;top:${y * S}px;background:${TERR[t] || "#444"}"></div>`).join("")).join("");
  const obj = m.objects.map(o => `<div class="obj" style="left:${o.pos[0] * S}px;top:${o.pos[1] * S}px" title="${esc(o.id)} (${o.type})">${esc(o.type[0].toUpperCase())}</div>`).join("");
  const pin = (e, c) => `<div class="pin ${c}" style="left:${e.pos[0] * S}px;top:${e.pos[1] * S}px" title="${esc(U(e.id))} (${e.pos})">${avatar(e.id)}</div>`;
  return `<div class="mm" style="width:${w * S}px;height:${h * S}px">${tiles}${obj}${m.players.map(e => pin(e, "p")).join("")}${m.enemies.map(e => pin(e, "e")).join("")}</div>`;
}
async function renderMis() {
  setTimeout(updateStatus, 0);
  if (!MIS) {
    $("#main").innerHTML = '<p class="hint">Lade Missionen …</p>';
    MIS = await (await fetch("/api/missions")).json(); mis = JSON.parse(JSON.stringify(MIS.missions)); mis.forEach(m => misSaved[m.id] = misPart(m));
  }
  const m = mCh(), wn = misWarnings(m), dirty = misDirty();
  const card = (e, side, i) => {
    const u = DB.units[e.id] || {}, key = side === "p" ? "p:" + e.id : "e:" + e.id + ":" + e.pos, w = wn.byCard[key] || [];
    const extra = side === "e" ? [e.hp ? `${e.hp} Leben` : "", e.carry ? "trägt Beute" : "", e.guard ? "Wache" : ""].filter(Boolean).join(" · ") : "";
    return `<div class="mcard ${w.length ? "warn" : ""}" draggable="true" data-drag="mcard" data-side="${side}" data-i="${i}">${avatar(e.id)}<b>${esc(U(e.id))}</b>
      <button class="x" data-act="mrem" data-side="${side}" data-i="${i}" aria-label="${esc(U(e.id))} entfernen" title="Aus der Mission nehmen">✕</button>
      <small>${esc([u.role ? { tank: "Tank", damage: "Schaden", healer: "Heiler", mage: "Magier", melee: "Nahkampf", ranged: "Fernkampf", soldier: "Soldat" }[u.role] || u.role : "", u.intro ? `eingeführt in K${u.intro}` : "", `Feld ${e.pos[0]}, ${e.pos[1]}`, extra].filter(Boolean).join(" · "))}</small>
      ${w.map(t => `<div class="wn">⚠ ${esc(t)}</div>`).join("")}</div>`;
  };
  $("#main").innerHTML = `<div class="mbar">${mis.map(x => `<button class="chip2" data-act="mch" data-id="${x.id}" aria-pressed="${x.id === mCur}">${x.n} ${esc(x.title)}${dirty.includes(x.id) ? ' <span class="dot warn"></span>' : ""}</button>`).join("")}
      </div>
    <p class="hint" style="margin:0 0 10px">${esc(m.briefing)}</p>
    <div class="mgrid"><div>
      <div class="mlist" data-drop="mgroup"><h3>Gruppe <span class="count">${m.players.length}</span><button class="btn" data-act="madd" data-side="p" style="margin-left:auto">+ Held</button></h3>
        <div class="mcards">${m.players.map((e, i) => card(e, "p", i)).join("") || '<div class="empty">Held hierher ziehen</div>'}</div></div>
      <div class="mlist" data-drop="menemy"><h3>Gegner <span class="count">${m.enemies.length}</span><button class="btn" data-act="madd" data-side="e" style="margin-left:auto">+ Gegner</button></h3>
        <div class="mcards">${m.enemies.map((e, i) => card(e, "e", i)).join("") || '<div class="empty">Gegner hierher ziehen</div>'}</div>
        <p class="hint" style="margin:8px 0 0">Neue Gegner bekommen keine Beute und keine Sonderwerte. Mehr oder weniger Gegner ändert die Schwierigkeit (Balancing messen mit <code>tools/balance.py</code>).</p></div>
    </div><div>
      ${miniMap(m)}
      <div class="mwarn"><h3>Story-Prüfung</h3><ul>${(() => { const all = [...wn.global, ...Object.values(wn.byCard).flat()]; return all.length ? all.map(t => `<li>⚠ ${esc(t)}</li>`).join("") : '<li class="ok">✓ Keine Widersprüche zur Geschichte gefunden.</li>'; })()}</ul></div>
    </div></div>`;
  updateStatus();
}
// ---- Ereignisse
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b && b.closest("#main")) { if (b.dataset.act === "toggle" && e.target.closest("button:not([data-act=toggle])")) return; e.stopPropagation(); acts[b.dataset.act]?.(b); return; }
  const n = e.target.closest(".ch"); if (n) { cur = n.dataset.id; render(); $("#main").scrollTop = 0; }
  if (!e.target.closest("#picker")) closePicker();
});
document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey, inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (mod && e.key === "s") { e.preventDefault(); save(); }
  else if (mod && e.key === "z" && !inField) { e.preventDefault(); e.shiftKey ? redoCur() : undoCur(); }
  else if (mod && e.key === "y" && !inField) { e.preventDefault(); redoCur(); }
  else if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("[data-act=pick], [data-act=toggle]") && e.target === document.activeElement) { e.preventDefault(); acts[e.target.dataset.act](e.target); }
});
document.addEventListener("focusin", e => { if (e.target.matches("textarea, input[data-bind]")) typingSnap = true; });
document.addEventListener("input", e => {
  const el = e.target, bind = el.dataset.bind; if (!bind) return;
  const grow = () => el.tagName === "TEXTAREA" && fit(el);
  if (["text", "tb", "note"].includes(bind)) {
    if (typingSnap) { push(); typingSnap = false; }
    const { c, lines, i, key } = lineCtx(el);
    if (bind === "text") lines[i].text = el.value;
    else if (bind === "tb") lines[i].text_by[el.dataset.k] = el.value;
    else if (key.startsWith("t:")) { const t = c.triggers[+key.slice(2)]; el.value ? t.note = el.value : delete t.note; }
    grow(); updateStatus();
  }
});
document.addEventListener("change", e => {
  const el = e.target, bind = el.dataset.bind;
  if (el.id === "addflee" && el.value) { const c = ch(), k = el.value; change(() => { c.flee[k] = [{ left: "$hero", right: k, speaker: k, right_expr: "wuetend", text: "" }]; open["f:" + k] = true; }); return; }
  if (!bind || !el.closest("#main")) return;
  const { c, lines, i, key } = lineCtx(el);
  if (bind === "expr") change(() => { const side = el.closest(".slot").dataset.side; el.value ? lines[i][side + "_expr"] = el.value : delete lines[i][side + "_expr"]; });
  else if (bind === "whentype") { const t = c.triggers[+key.slice(2)]; open["w" + key.slice(2)] = true; change(() => t.when = makeWhen(el.value, c.id)); }
  else if (bind === "field") {
    const t = c.triggers[+key.slice(2)], p = JSON.parse(el.dataset.p), ty = el.dataset.t; open["w" + key.slice(2)] = true;
    change(() => {
      let v = el.value;
      if (ty === "int" || ty === "int?") v = v === "" ? "" : parseInt(v, 10);
      else if (ty === "float") v = parseFloat(v);
      setP(t.when, p, v);
      if (t.when.fall && !Object.keys(t.when.fall).length) t.when.fall = {};
      if (p[0] === "object" && p[1] === "id") { const ty2 = c.objects.find(o => o.id === v)?.type; t.when.object.state = STATES[ty2]?.[0]; }
    });
  }
});
document.addEventListener("toggle", e => { const d = e.target; if (d.matches?.("details.trig")) open["w" + d.dataset.w] = d.open; }, true);

// Ziehen und Ablegen
let dragInfo = null;
document.addEventListener("dragstart", e => {
  const el = e.target.closest("[data-drag]"); if (!el) return;
  if (el.dataset.drag === "char") dragInfo = { type: "char", id: el.dataset.id };
  else if (el.dataset.drag === "mcard") dragInfo = { type: "mcard", side: el.dataset.side, i: +el.dataset.i };
  else { const { key, i } = lineCtx(el), li = el.closest(".line"); dragInfo = { type: "line", from: key + "|" + i }; li.classList.add("dragging"); e.dataTransfer.setDragImage(li, 20, 20); }
  e.dataTransfer.setData("text/plain", "x"); e.dataTransfer.effectAllowed = "move";
});
document.addEventListener("dragend", () => { dragInfo = null; document.querySelectorAll(".dragging,.over-top,.over-bot,.drop").forEach(x => x.classList.remove("dragging", "over-top", "over-bot", "drop")); });
document.addEventListener("dragover", e => {
  if (!dragInfo) return;
  const z = e.target.closest(dragInfo.type === "line" ? ".line, [data-drop=add]" : "[data-drop]"); if (!z) return;
  const k = z.dataset.drop;
  if ((dragInfo.type === "char" && (k === "mgroup" || k === "menemy")) || (dragInfo.type === "mcard" && k === "mrem")) { e.preventDefault(); document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); z.classList.add("drop"); return; }
  if (dragInfo.type === "char" && (k === "slot" || k === "add")) { e.preventDefault(); document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); z.classList.add("drop"); }
  if (dragInfo.type === "line" && (k === "line" || k === "add")) {
    e.preventDefault(); document.querySelectorAll(".over-top,.over-bot").forEach(x => x.classList.remove("over-top", "over-bot"));
    if (k === "line") { const r = z.getBoundingClientRect(); z.classList.add(e.clientY < r.top + r.height / 2 ? "over-top" : "over-bot"); }
  }
});
document.addEventListener("drop", e => {
  if (!dragInfo) return;
  const z = e.target.closest(dragInfo.type === "line" ? ".line, [data-drop=add]" : "[data-drop]"); if (!z) return;
  e.preventDefault();
  if (dragInfo.type === "mcard" && z.dataset.drop === "mrem") { misRemove(dragInfo.side, dragInfo.i); dragInfo = null; return; }
  if (dragInfo.type === "char" && (z.dataset.drop === "mgroup" || z.dataset.drop === "menemy")) { misAdd(z.dataset.drop === "mgroup" ? "p" : "e", dragInfo.id); dragInfo = null; return; }
  if (["mgroup", "menemy", "mrem"].includes(z.dataset.drop)) { dragInfo = null; return; }    // nur die oben behandelten Kombinationen sind Missions-Ziele
  const k = z.dataset.drop, { c, key, i, lines } = lineCtx(z, true);
  if (dragInfo.type === "char") {
    const id = dragInfo.id;
    if (k === "slot") change(() => setChar(lines, i, z.dataset.side, id));
    else if (k === "add") change(() => newLine(lines, id));
  } else if (k === "line") { const r = z.getBoundingClientRect(); onMove(dragInfo.from, { key, idx: e.clientY < r.top + r.height / 2 ? i : i + 1 }); }
  else if (k === "add") onMove(dragInfo.from, { key, idx: lines.length });
  dragInfo = null;
});

$("#q").oninput = e => { filter = e.target.value; render(); };
$("#tabTalks").onclick = () => setView("talks"); $("#tabChars").onclick = () => setView("char"); $("#tabMis").onclick = () => setView("mis"); $("#tabSec").onclick = () => setView("sec");
document.addEventListener("input", e => {
  const el = e.target; if (!el.matches?.(".cnote-ta")) return;
  fit(el);
  const c = CH.characters.find(x => x.id === el.dataset.cnote), slot = +el.dataset.slot, nt = c.ability_notes, key = c.id + ":" + slot;
  const cur = nt.saved[slot] ?? nt.defaults[slot];
  if (el.value.trim() === cur.trim()) delete noteDirty[key]; else noteDirty[key] = el.value;
  const st = document.querySelector(`[data-cstat="${c.id}:${slot}"]`); if (st) st.textContent = noteDirty[key] !== undefined ? "● ungespeichert" : "";
  updateStatus();
});
document.addEventListener("input", e => { if (e.target.id === "cq") { cq = e.target.value; renderCharRes(); } });
$("#undo").onclick = undoCur; $("#redo").onclick = redoCur; $("#save").onclick = save; $("#palq").oninput = renderPalette;
$("#togglePal").onclick = () => document.body.classList.toggle("pal-open");
addEventListener("beforeunload", e => { if (totalDirty()) { e.preventDefault(); e.returnValue = ""; } });

(async () => {
  DB = await (await fetch("/api/data")).json();
  canDraft = (await (await fetch("/api/draft/available")).json()).available;
  chapters = DB.chapters; chapters.forEach(c => saved[c.id] = part(c)); cur = chapters[0].id;
  open.intro = true;
  renderPalette(); render();
  document.fonts.ready.then(fitAll);   // Schrift laedt spaeter: Hoehe danach neu berechnen
})();
addEventListener("resize", () => fitAll());

# Veroeffentlicht die Mitmach-Version des Text-Editors auf GitHub Pages (tools/dialog_editor/build_pages.py).
# Einmalig noetig: Repository, Settings, Pages, Source = "GitHub Actions".
name: Text-Editor auf GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "game/data/**"
      - "game/assets/portraits/**"
      - "game/assets/fonts/**"
      - "tools/dialog_editor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Editor bauen
        run: python3 tools/dialog_editor/build_pages.py out/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/pages
      - id: deployment
        uses: actions/deploy-pages@v4
